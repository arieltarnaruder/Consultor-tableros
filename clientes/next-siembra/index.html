<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tablero de Generacion de Demanda - Next Siembra</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#F1F5F9}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:#64748B}
.spinner{width:36px;height:36px;border:3px solid #E2E8F0;border-top:3px solid #F05A28;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media screen {.print-only { display: none !important; }}
@media print {
.no-print { display: none !important; }
.print-only { display: block !important; width: 100%; color: #0F172A; }
body { background: #fff; font-size: 10pt; margin: 0; padding: 0; }
@page { margin: 15mm; size: A4; }
.print-break-avoid { page-break-inside: avoid; }
.print-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 9pt; }
.print-table th { text-align: left; padding: 6px 8px; border-bottom: 2px solid #CBD5E1; color: #475569; }
.print-table td { padding: 6px 8px; border-bottom: 1px solid #E2E8F0; vertical-align: top; }
.print-badge { padding: 2px 6px; border-radius: 4px; font-size: 8pt; font-weight: 700; }
}
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useMemo,useEffect,useCallback,useRef} = React;
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1uHTOXpE-RKlqz3VNmc4SI2TVriXlCScAAikg70NhnS8/export?format=csv&gid=0";
const USUARIOS_INIT = [
{ id: "ariel", nombre: "Ariel Tarnaruder", rol: "sr", zona: null, pin: "2502", email: "ariel@consultor.com" },
{ id: "maxi", nombre: "Maxi Donolo", rol: "sr", zona: null, pin: "1111", email: "maxi@nextsiembra.com" },
{ id: "adrian", nombre: "Adrián Bonfiglio", rol: "lider", zona: null, pin: "2222", email: "adrian@nextsiembra.com" }
];
const ZONAS = ["Vendedor 1", "Vendedor 2", "Vendedor 3", "Vendedor 4"];
const CLIENTE = { nombre: "Next Siembra", subtitulo: "Maestro de Generación de Demanda", colorA: "#F05A28", colorB: "#2D2D2D", colorC: "#F5A623" };

function puedeEditar(usuario, tarea) {
if (!usuario) return false;
if (usuario.rol === "sr" || usuario.rol === "lider") return true;
return tarea?.responsable?.toLowerCase().includes(usuario.rol.toLowerCase()) || tarea?.responsable?.toLowerCase().includes(usuario.nombre.toLowerCase());
}

function parseCSV(text) {
const lines = []; let row = [""]; let inQuotes = false;
for (let i = 0; i < text.length; i++) {
const c = text[i]; const next = text[i+1];
if (c === '"') { if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; } else { inQuotes = !inQuotes; } }
else if (c === ',' && !inQuotes) row.push("");
else if ((c === '\r' || c === '\n') && !inQuotes) { if (c === '\r' && next === '\n') i++; lines.push(row); row = [""]; }
else row[row.length - 1] += c;
}
return lines;
}

function MiniTarea({ t, onEditar }) {
const { bar } = { bar: "#F05A28" }; // Simplified for brevity
return React.createElement("div", { onClick: () => onEditar(t), style: { background: "#fff", border: "1px solid #E2E8F0", borderRadius: 10, padding: 12, cursor: "pointer" } },
React.createElement("div", null, t.tarea),
React.createElement("div", { style: { fontSize: 11, color: "#475569" } }, "Resp: ", t.responsable),
t.colaboradores && React.createElement("div", { style: { fontSize: 11, color: "#0891b2", fontWeight: 700 } }, "Colab: ", t.colaboradores)
);
}

function App() {
const [tareas, setTareas] = useState([]);
const [loading, setLoading] = useState(true);
useEffect(() => {
fetch(SHEET_CSV_URL).then(res => res.text()).then(csvText => {
const lineas = parseCSV(csvText);
const encabezados = lineas[0].map(h => h.trim().toLowerCase());
const raw = lineas.slice(1).map((fila, i) => {
const t = {};
encabezados.forEach((h, idx) => t[h === "accion" ? "tarea" : h] = fila[idx]?.trim());
return { 
id: i, 
tarea: t.tarea, 
responsable: t.responsable, 
colaboradores: t.colaboradores || "", 
avance: parseFloat(t.avance) || 0,
estado: t.estado,
plan: t.plan
};
});
setTareas(raw);
setLoading(false);
});
}, []);

if (loading) return React.createElement("div", null, "Cargando...");
return React.createElement("div", null, tareas.map(t => React.createElement(MiniTarea, { key: t.id, t: t, onEditar: () => {} })));
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
