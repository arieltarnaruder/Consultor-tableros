<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Next Siembra - Tablero PAC Dinámico</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#F1F5F9}
    #loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:#64748B}
    .spinner{width:36px;height:36px;border:3px solid #E2E8F0;border-top:3px solid #2E7D32;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <span>Sincronizando matriz comercial con Google Sheets...</span>
    </div>
  </div>

  <script>
const { useState, useMemo, useEffect, useCallback } = React;

// CONFIGURACIONES VISUALES DEL CLIENTE (Mapeadas directo para Next Siembra)
const COLOR_PRIMARY   = "#2E7D32"; 
const COLOR_SECONDARY = "#2D2D2D";
const COLOR_ACCENT    = "#0EA5E9";
const NEGOCIO_LABEL   = "Next Siembra";
const TABLERO_NOMBRE  = "Tablero PAC - Matriz de Control";

// URL de exportación CSV pública de la Google Sheet provista por el usuario
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1uHTOXpE-RKlqz3VNmc4SI2TVriXlCScAAikg70NhnS8/export?format=csv&gid=0";

// ─── HELPERS DE SEMÁFORO Y FORMATO ──────────────────────────────────────────
function colorAvance(v) {
  if (v >= 1.0) return { bar:"#3B82F6", bg:"#EFF6FF", text:"#1D4ED8", label:"Completa" };
  if (v >= 0.80) return { bar:"#22C55E", bg:"#F0FDF4", text:"#15803D", label:"Avanzado" };
  if (v >= 0.50) return { bar:"#EAB308", bg:"#FEFCE8", text:"#854D0E", label:"En marcha" };
  if (v >= 0.10) return { bar:"#F97316", bg:"#FFF7ED", text:"#C2410C", label:"Iniciado" };
  return { bar:"#EF4444", bg:"#FEF2F2", text:"#B91C1C", label:"Sin inicio" };
}

const ESTADO_CFG = {
  "Pendiente": { bg:"#FFF7ED", text:"#C2410C", dot:"#F97316" },
  "En curso":  { bg:"#EFF6FF", text:"#1D4ED8", dot:"#3B82F6" },
  "Bloqueada": { bg:"#FFF1F2", text:"#BE123C", dot:"#F43F5E" },
  "Cerrada":   { bg:"#F0FDF4", text:"#15803D", dot:"#22C55E" },
};

const PRIO_CFG = {
  "Alta":  { bg:"#FEF2F2", text:"#B91C1C" },
  "Media": { bg:"#FFFBEB", text:"#854D0E" },
  "Baja":  { bg:"#F0FDF4", text:"#166534" },
};

const PROG_COLORS = [COLOR_PRIMARY, "#0EA5E9", "#8B5CF6", "#22C55E", "#EC4899", "#64748B", "#F97316", "#0D9488"];
const pct = v => Math.round(v * 100);
const avg = arr => arr.length ? arr.reduce((a,b) => a + b, 0) / arr.length : 0;

// PARSER MANUAL DE CSV RESISTENTE A COMAS DENTRO DE COMILLAS
function parseCSV(text) {
  const lines = [];
  let row = [""];
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i+1];
    if (c === '"') {
      if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (c === ',' && !inQuotes) {
      row.push("");
    } else if ((c === '\r' || c === '\n') && !inQuotes) {
      if (c === '\r' && next === '\n') { i++; }
      lines.push(row);
      row = [""];
    } else {
      row[row.length - 1] += c;
    }
  }
  if (row.length > 1 || row[0] !== "") lines.push(row);
  return lines;
}

// ─── COMPONENTES INTERNOS DE LA INTERFAZ ──────────────────────────────────────
function LogoNextSiembra({ height = 40 }) {
  return React.createElement("svg", { height, viewBox:"0 0 200 54", fill:"none" },
    React.createElement("text", { x:"0", y:"38", fontFamily:"Arial Black,Impact,sans-serif", fontWeight:"900", fontSize:"38", fill:COLOR_PRIMARY, letterSpacing:"-1" }, "NEXT"),
    React.createElement("text", { x:"2", y:"52", fontFamily:"Arial,sans-serif", fontWeight:"700", fontSize:"13", fill:COLOR_SECONDARY, letterSpacing:"4" }, "SIEMBRA"));
}

function BarraAvance({ valor, height = 8 }) {
  const { bar } = colorAvance(valor);
  return React.createElement("div", { style:{ background:"#E2E8F0", borderRadius:99, height, overflow:"hidden" } },
    React.createElement("div", { style:{ width:`${pct(valor)}%`, height:"100%", background:bar, borderRadius:99, transition:"width .4s" } }));
}

function Badge({ label, tipo }) {
  const cfg = tipo === "estado" ? ESTADO_CFG[label] : PRIO_CFG[label];
  if (!cfg) return React.createElement("span", { style:{ fontSize:11, background:"#F1F5F9", color:"#475569", borderRadius:99, padding:"2px 9px" } }, label);
  return React.createElement("span", { style:{ fontSize:11, background:cfg.bg, color:cfg.text, borderRadius:99, padding:"2px 9px", fontWeight:700 } }, label);
}

// CORRECCIÓN: Definición explícita de los argumentos recibidos para evitar fallos de referencia
function CirculoAvance({ valor, size = 52 }) {
  const { bar } = colorAvance(valor);
  const r = (size - 6) / 2;
  const circ = 2 * Math.PI * r;
  const dash = circ * valor;
  return React.createElement("svg", { width:size, height:size, viewBox:`0 0 ${size} ${size}` },
    React.createElement("circle", { cx:size/2, cy:size/2, r, fill:"none", stroke:"#E2E8F0", strokeWidth:4 }),
    React.createElement("circle", { cx:size/2, cy:size/2, r, fill:"none", stroke:bar, strokeWidth:4, strokeDasharray:`${dash} ${circ}`, strokeLinecap:"round", transform:`rotate(-90 ${size/2} ${size/2})`, style:{transition:"stroke-dasharray .4s"} }),
    React.createElement("text", { x:size/2, y:size/2 + 1, textAnchor:"middle", dominantBaseline:"middle", fontSize:size > 44 ? 11 : 9, fontWeight:800, fill:bar }, pct(valor) + "%"));
}

function LeyendaSemaforo() {
  const items = [
    {color:"#EF4444", label:"Sin inicio"},
    {color:"#F97316", label:"Iniciado"},
    {color:"#EAB308", label:"En marcha"},
    {color:"#22C55E", label:"Avanzado"},
    {color:"#3B82F6", label:"Completa"},
  ];
  return React.createElement("div", { style:{ display:"flex", flexWrap:"wrap", gap:12, alignItems:"center", padding:"10px 16px", background:"#F8FAFC", border:"1px solid #E2E8F0", borderRadius:10, marginBottom:16 } },
    React.createElement("span", { style:{ fontSize:11, fontWeight:700, color:"#64748B", textTransform:"uppercase" } }, "Métricas:"),
    items.map(it => React.createElement("span", { key:it.label, style:{ display:"flex", alignItems:"center", gap:5, fontSize:12, color:"#475569" } },
      React.createElement("span", { style:{ width:10, height:10, borderRadius:"50%", background:it.color, display:"inline-block" } }), it.label)));
}

// ─── VISTA RESUMEN ────────────────────────────────────────────────────────────
function VistaEjecutiva({ tareas, onIrAPrograma }) {
  const programas = useMemo(() => [...new Set(tareas.map(t => t.programa))], [tareas]);
  const totalAv = avg(tareas.map(t => t.avance));
  const { bar, label } = colorAvance(totalAv);
  
  const cerradas = tareas.filter(t => t.estado === "Cerrada").length;
  const enCurso = tareas.filter(t => t.estado === "En curso").length;
  const bloqueadas = tareas.filter(t => t.estado === "Bloqueada").length;

  return React.createElement("div", { style:{ display:"flex", flexDirection:"column", gap:16 } },
    React.createElement(LeyendaSemaforo),
    React.createElement("div", { style:{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(180px, 1fr))", gap:12 } },
      [
        { label:"Avance PAC", val:pct(totalAv) + "%", sub:label, color:bar },
        { label:"Tareas Completas", val:cerradas + "/" + tareas.length, sub:"Ejecutadas", color:"#22C55E" },
        { label:"En Proceso", val:enCurso, sub:"Activas", color:"#3B82F6" },
        { label:"Bloqueadas / Alertas", val:bloqueadas, sub:"Frenadas", color:"#F43F5E" }
      ].map(k => React.createElement("div", { key:k.label, style:{ background:"#fff", borderRadius:12, padding:"16px", border:"1px solid #E2E8F0", borderTop:`3px solid ${k.color}` } },
        React.createElement("div", { style:{ fontSize:10, color:"#64748B", fontWeight:700, textTransform:"uppercase", marginBottom:4 } }, k.label),
        React.createElement("div", { style:{ fontSize:24, fontWeight:900, color:k.color, marginBottom:2 } }, k.val),
        React.createElement("div", { style:{ fontSize:11, color:"#94A3B8" } }, k.sub)))),
    React.createElement("div", { style:{ background:"#fff", borderRadius:12, padding:20, border:"1px solid #E2E8F0" } },
      React.createElement("div", { style:{ fontSize:14, fontWeight:700, color:"#0F172A", marginBottom:8 } }, "Estructura Global del Plan Estratégico"),
      React.createElement(BarraAvance, { valor:totalAv, height:10 })),
    React.createElement("div", { style:{ background:"#fff", borderRadius:12, border:"1px solid #E2E8F0", overflow:"hidden" } },
      React.createElement("div", { style:{ padding:"14px 16px", borderBottom:"1px solid #F1F5F9", fontSize:14, fontWeight:700, color:"#0F172A" } }, "Avance Consolidado por Programa"),
      programas.map((prog, idx) => {
        const ts = tareas.filter(t => t.programa === prog);
        const av = avg(ts.map(t => t.avance));
        return React.createElement("div", { key:prog, onClick:() => onIrAPrograma(prog), style:{ display:"flex", alignItems:"center", gap:14, padding:"14px 16px", borderBottom:idx < programas.length-1 ? "1px solid #F8FAFC" : "none", cursor:"pointer" } },
          React.createElement("div", { style:{ width:10, height:10, borderRadius:"50%", background:PROG_COLORS[idx % PROG_COLORS.length] } }),
          React.createElement("div", { style:{ flex:1 } },
            React.createElement("div", { style:{ fontSize:13, fontWeight:700, color:"#0F172A", marginBottom:4 } }, prog),
            React.createElement(BarraAvance, { valor:av, height:5 })),
          React.createElement(CirculoAvance, { valor:av, size:42 }));
      })));
}

// ─── VISTA DESGLOSADA POR PROGRAMA / PLAN ─────────────────────────────────────
function VistaEstructura({ tareas, progFiltro }) {
  const [abiertos, setAbiertos] = useState({});
  const programas = useMemo(() => [...new Set(tareas.map(t => t.programa))], [tareas]);

  const programasVisibles = useMemo(() => {
    return progFiltro === "Todos" ? programas : programas.filter(p => p === progFiltro);
  }, [programas, progFiltro]);

  return React.createElement("div", { style:{ display:"flex", flexDirection:"column", gap:12 } },
    programasVisibles.map((prog, pIdx) => {
      const tsProg = tareas.filter(t => t.programa === prog);
      const avProg = avg(tsProg.map(t => t.avance));
      const planes = [...new Set(tsProg.map(t => t.plan))];

      return React.createElement("div", { key:prog, style:{ background:"#fff", borderRadius:12, border:"1px solid #E2E8F0", overflow:"hidden" } },
        React.createElement("div", { style:{ display:"flex", alignItems:"center", gap:12, padding:"14px 16px", background:"#FAFAFA", borderBottom:"1px solid #E2E8F0" } },
          React.createElement("div", { style:{ width:12, height:12, borderRadius:"50%", background:PROG_COLORS[pIdx % PROG_COLORS.length] } }),
          React.createElement("div", { style:{ flex:1 } },
            React.createElement("div", { style:{ fontSize:15, fontWeight:800, color:"#0F172A" } }, prog),
            React.createElement("div", { style:{ fontSize:11, color:"#64748B" } }, tsProg.length, " iniciativas comerciales")),
          React.createElement(CirculoAvance, { valor:avProg, size:44 })),
        planes.map(plan => {
          const tsPlan = tsProg.filter(t => t.plan === plan);
          const avPlan = avg(tsPlan.map(t => t.avance));
          const key = prog + "::" + plan;
          const isOpen = !!abiertos[key];

          return React.createElement("div", { key:plan, style:{ borderBottom:"1px solid #F1F5F9" } },
            React.createElement("div", { onClick:() => setAbiertos(p => ({...p, [key]: !p[key]})), style:{ display:"flex", alignItems:"center", gap:10, padding:"12px 16px 12px 28px", cursor:"pointer", background:isOpen?"#FFFBFB":"#fff" } },
              React.createElement("div", { style:{ flex:1 } },
                React.createElement("div", { style:{ fontSize:13, fontWeight:700, color:"#334155" } }, plan),
                React.createElement("div", { style:{ fontSize:11, color:"#94A3B8" } }, tsPlan.length, " acciones estratégicas")),
              React.createElement(CirculoAvance, { valor:avPlan, size:36 }),
              React.createElement("span", { style:{ color:"#94A3B8", fontSize:12, marginLeft:4 } }, isOpen ? "▲" : "▼")),
            isOpen && React.createElement("div", { style:{ background:"#FCFDFD", padding:"4px 0" } },
              tsPlan.map(t => React.createElement("div", { key:t.id, style:{ display:"flex", alignItems:"center", gap:12, padding:"10px 16px 10px 44px", borderTop:"1px solid #F8FAFC" } },
                React.createElement("div", { style:{ flex:1 } },
                  React.createElement("div", { style:{ fontSize:13, fontWeight:500, color:"#1E293B", marginBottom:4 } }, t.tarea),
                  React.createElement("div", { style:{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" } },
                    React.createElement(Badge, { label:t.estado, tipo:"estado" }),
                    React.createElement(Badge, { label:t.prioridad, tipo:"prioridad" }),
                    t.responsable && React.createElement("span", { style:{ fontSize:11, color:"#475569", background:"#E2E8F0", padding:"1px 6px", borderRadius:4 } }, t.responsable))),
                React.createElement(CirculoAvance, { valor:t.avance, size:34 }))))
          );
        }));
    }));
}

// ─── COMPONENTE RAÍZ PRINCIPAL ────────────────────────────────────────────────
function App() {
  const [tareas, setTareas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [vista, setVista] = useState("ejecutivo");
  const [progFiltro, setProgFiltro] = useState("Todos");

  useEffect(() => {
    fetch(SHEET_CSV_URL)
      .then(res => { if (!res.ok) throw new Error("No se pudo conectar con la base de datos."); return res.text(); })
      .then(csvText => {
        const lineas = parseCSV(csvText);
        if (lineas.length <= 1) { setTareas([]); setLoading(false); return; }
        
        const encabezados = lineas[0].map(h => h.trim().toLowerCase());
        const rawTareas = [];

        for (let i = 1; i < lineas.length; i++) {
          const fila = lineas[i];
          if (fila.length < 3 || !fila[0]) continue; 

          const t = {};
          encabezados.forEach((h, idx) => { t[h] = fila[idx] ? fila[idx].trim() : ""; });
          
          // Formateo de métricas numéricas fijando base segura
          let avNum = parseFloat(t.avance ? t.avance.replace("%", "") : "0");
          if (avNum > 1) avNum = avNum / 100;

          rawTareas.push({
            id: i,
            programa: t.programa || "Sin Programa",
            plan: t.plan || "Sin Plan",
            tarea: t.tarea || "Acción sin nombre",
            responsable: t.responsable || "",
            estado: t.estado || "Pendiente",
            prioridad: t.prioridad || "Media",
            avance: isNaN(avNum) ? 0 : avNum,
            comentarios: t.comentarios || ""
          });
        }
        setTareas(rawTareas);
        setLoading(false);
      })
      .catch(err => { console.error(err); setError(err.message); setLoading(false); });
  }, []);

  // CORRECCIÓN SINTÁCTICA: Alineado exacto con el parámetro esperado por el componente hijo
  const handleIrAPrograma = prog => { setProgFiltro(prog); setVista("detallado"); };

  if (loading) return React.createElement("div", { id:"loading" }, React.createElement("div", { className:"spinner" }), React.createElement("span", null, "Sincronizando matriz comercial con Google Sheets..."));
  if (error) return React.createElement("div", { style:{ padding:40, textAlign:"center", color:"#B91C1C", fontWeight:700 } }, "Error de conexión: ", error);

  const programasUnicos = [...new Set(tareas.map(t => t.programa))];

  return React.createElement("div", { style:{ minHeight:"100vh", background:"#F1F5F9" } },
    React.createElement("div", { style:{ background:"#fff", borderBottom:"1px solid #E2E8F0", position:"sticky", top:0, zIndex:100 } },
      React.createElement("div", { style:{ maxWidth:960, margin:"0 auto", padding:"0 16px" } },
        React.createElement("div", { style:{ height:4, background:`linear-gradient(90deg, ${COLOR_PRIMARY}, ${COLOR_ACCENT})`, margin:"0 -16px" } }),
        React.createElement("div", { style:{ display:"flex", justifyDcontent:"space-between", alignItems:"center", padding:"12px 0" } },
          React.createElement(LogoNextSiembra),
          React.createElement("div", { style:{ textAlign:"right" } },
            React.createElement("div", { style:{ fontSize:13, fontWeight:800, color:COLOR_PRIMARY } }, NEGOCIO_LABEL),
            React.createElement("div", { style:{ fontSize:11, color:"#94A3B8", fontWeight:600 } }, TABLERO_NOMBRE))),
        React.createElement("div", { style:{ display:"flex", gap:16, marginTop:8 } },
          React.createElement("button", { onClick:() => setVista("ejecutivo"), style:{ padding:"10px 14px", background:"none", border:"none", fontSize:13, fontWeight:700, color:vista==="ejecutivo"?COLOR_PRIMARY:"#64748B", borderBottom:`3px solid ${vista==="ejecutivo"?COLOR_PRIMARY:"transparent"}`, cursor:"pointer" } }, "Vista Ejecutiva"),
          React.createElement("button", { onClick:() => setVista("detallado"), style:{ padding:"10px 14px", background:"none", border:"none", fontSize:13, fontWeight:700, color:vista==="detallado"?COLOR_PRIMARY:"#64748B", borderBottom:`3px solid ${vista==="detallado"?COLOR_PRIMARY:"transparent"}`, cursor:"pointer" } }, "Matriz de Programas")))),
    
    React.createElement("div", { style:{ maxWidth:960, margin:"0 auto", padding:"20px 16px 60px" } },
      vista === "ejecutivo" 
        ? React.createElement(VistaEjecutiva, { tareas, onIrAPrograma: handleIrAPrograma })
        : React.createElement("div", { style:{ display:"flex", flexDirection:"column", gap:14 } },
            React.createElement("div", { style:{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center", marginBottom:4 } },
              React.createElement("span", { style:{ fontSize:12, fontWeight:700, color:"#64748B" } }, "Filtrar por sección:"),
              React.createElement("button", { onClick:() => setProgFiltro("Todos"), style:{ padding:"6px 12px", borderRadius:20, border:`1px solid ${progFiltro==="Todos"?COLOR_PRIMARY:"#E2E8F0"}`, background:progFiltro==="Todos"?"#FFF5F3":"#fff", color:progFiltro==="Todos"?COLOR_PRIMARY:"#475569", fontSize:12, fontWeight:600, cursor:"pointer" } }, "Todos"),
              programasUnicos.map(p => React.createElement("button", { key:p, onClick:() => setProgFiltro(p), style:{ padding:"6px 12px", borderRadius:20, border:`1px solid ${progFiltro===p?COLOR_PRIMARY:"#E2E8F0"}`, background:progFiltro===p?"#FFF5F3":"#fff", color:progFiltro===p?COLOR_PRIMARY:"#475569", fontSize:12, fontWeight:600, cursor:"pointer" } }, p))),
            React.createElement(VistaEstructura, { tareas, progFiltro }))
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
