<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Siembra - Tablero de Control PAC</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">
    <div id="root"></div>

    <script>
        const { useState, useEffect, useMemo } = React;

        // CONFIGURACIÓN VISUAL ORIGINAL DEL CLIENTE
        const CONFIG = {
            primary: "#2E7D32",    // Verde Next Siembra
            secondary: "#2D2D2D",  // Gris Oscuro
            accent: "#0EA5E9",     // Azul Cielo
            pinCorrecto: "2502"    // Tu clave original de acceso
        };

        // URL de exportación CSV de tu Google Sheet
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1uHTOXpE-RKlqz3VNmc4SI2TVriXlCScAAikg70NhnS8/export?format=csv&gid=0";

        // PARSER DE CSV RESISTENTE
        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push("");
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [""];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== "") lines.push(row);
            return lines;
        }

        const avg = arr => arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : 0;

        function obtenerSemaforo(valor) {
            if (valor >= 1.0) return { color: "#3B82F6", texto: "Completa", bg: "bg-blue-50", text: "text-blue-700", border: "border-blue-200" };
            if (valor >= 0.80) return { color: "#22C55E", texto: "Avanzado", bg: "bg-green-50", text: "text-green-700", border: "border-green-200" };
            if (valor >= 0.50) return { color: "#EAB308", texto: "En marcha", bg: "bg-yellow-50", text: "text-yellow-700", border: "border-yellow-200" };
            if (valor >= 0.10) return { color: "#F97316", texto: "Iniciado", bg: "bg-orange-50", text: "text-orange-700", border: "border-orange-200" };
            return { color: "#EF4444", texto: "Sin inicio", bg: "bg-red-50", text: "text-red-700", border: "border-red-200" };
        }

        // ─── PANTALLA DE LOGIN (RESTAURADA) ───────────────────────────────────
        function Login({ onLogin }) {
            const [pin, setPin] = useState("");
            const [error, setError] = useState(false);

            const manejarSubmit = (e) => {
                e.preventDefault();
                if (pin === CONFIG.pinCorrecto) {
                    onLogin();
                } else {
                    setError(true);
                    setPin("");
                }
            };

            return React.createElement("div", { class: "min-h-screen flex items-center justify-center bg-gray-900 px-4" },
                React.createElement("div", { class: "bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8", style: { borderColor: CONFIG.primary } },
                    React.createElement("div", { class: "text-center mb-8" },
                        React.createElement("h2", { class: "text-3xl font-black tracking-tight", style: { color: CONFIG.primary } }, "NEXT SIEMBRA"),
                        React.createElement("p", { class: "text-gray-500 text-sm mt-1 uppercase tracking-widest font-bold" }, "Tablero de Control PAC")),
                    React.createElement("form", { onSubmit: manejarSubmit, class: "space-y-6" },
                        React.createElement("div", null,
                            React.createElement("label", { class: "block text-sm font-bold text-gray-700 mb-2" }, "Código de Acceso Consultor"),
                            React.createElement("input", {
                                type: "password",
                                maxLength: 4,
                                value: pin,
                                onChange: (e) => { setError(false); setPin(e.target.value); },
                                placeholder: "••••",
                                class: `w-full text-center text-2xl tracking-widest p-3 border-2 rounded-xl focus:outline-none transition-all ${error ? "border-red-500 bg-red-50 animate-shake" : "border-gray-300 focus:border-green-600"}`
                            })),
                        error && React.createElement("p", { class: "text-red-600 text-sm font-semibold text-center" }, "Código incorrecto. Intente nuevamente."),
                        React.createElement("button", { type: "submit", class: "w-full text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all transform active:scale-95 hover:opacity-90", style: { background: CONFIG.primary } }, "Ingresar al Tablero")
                    )
                )
            );
        }

        // ─── INTERFAZ PRINCIPAL RESTAURADA ────────────────────────────────────
        function App() {
            const [autorizado, setAutorizado] = useState(false);
            const [tareas, setTareas] = useState([]);
            const [loading, setLoading] = useState(true);
            const [tabActiva, setTabActiva] = useState("resumen");

            // Filtros de navegación originales
            const [progSel, setProgSel] = useState("Todos");
            const [planSel, setPlanSel] = useState("Todos");

            useEffect(() => {
                if (!autorizado) return;
                fetch(SHEET_CSV_URL)
                    .then(res => res.text())
                    .then(csvText => {
                        const lineas = parseCSV(csvText);
                        if (lineas.length <= 1) { setTareas([]); setLoading(false); return; }
                        const headers = lineas[0].map(h => h.trim().toLowerCase());
                        const raw = [];
                        for (let i = 1; i < lineas.length; i++) {
                            const f = lineas[i];
                            if (f.length < 3 || !f[0]) continue;
                            const t = {};
                            headers.forEach((h, idx) => { t[h] = f[idx] ? f[idx].trim() : ""; });
                            
                            let avNum = parseFloat(t.avance ? t.avance.replace("%", "") : "0");
                            if (avNum > 1) avNum = avNum / 100;

                            raw.push({
                                id: i,
                                programa: t.programa || "Sin Programa",
                                plan: t.plan || "Sin Plan",
                                tarea: t.tarea || "Sin Nombre",
                                responsable: t.responsable || "No asignado",
                                estado: t.estado || "Pendiente",
                                prioridad: t.prioridad || "Media",
                                avance: isNaN(avNum) ? 0 : avNum,
                                comentarios: t.comentarios || ""
                            });
                        }
                        setTareas(raw);
                        setLoading(false);
                    })
                    .catch(err => { console.error(err); setLoading(false); });
            }, [autorizado]);

            // Listados dinámicos para filtros originales
            const programasUnicos = useMemo(() => ["Todos", ...new Set(tareas.map(t => t.programa))], [tareas]);
            const planesUnicos = useMemo(() => {
                const filtradas = progSel === "Todos" ? tareas : tareas.filter(t => t.programa === progSel);
                return ["Todos", ...new Set(filtradas.map(t => t.plan))];
            }, [tareas, progSel]);

            // Mapeo final de tareas filtradas
            const tareasFiltradas = useMemo(() => {
                return tareas.filter(t => {
                    const cumplaProg = progSel === "Todos" || t.programa === progSel;
                    const cumplaPlan = planSel === "Todos" || t.plan === planSel;
                    return cumplaProg && cumplaPlan;
                });
            }, [tareas, progSel, planSel]);

            if (!autorizado) {
                return React.createElement(Login, { onLogin: () => setAutorizado(true) });
            }

            if (loading) {
                return React.createElement("div", { class: "min-h-screen flex flex-col items-center justify-center bg-gray-50" },
                    React.createElement("div", { class: "w-12 h-12 border-4 border-gray-200 rounded-full animate-spin mb-4", style: { borderTopColor: CONFIG.primary } }),
                    React.createElement("p", { class: "text-gray-600 font-bold" }, "Sincronizando con Google Sheets...")
                );
            }

            const avanceGlobal = avg(tareas.map(t => t.avance));

            return React.createElement("div", { class: "min-h-screen flex flex-col bg-gray-50" },
                // Header Original de Ariel
                React.createElement("header", { class: "bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm" },
                    React.createElement("div", { class: "max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4" },
                        React.createElement("div", { class: "flex items-center gap-3" },
                            React.createElement("div", { class: "w-10 h-10 rounded-xl flex items-center justify-center text-white text-xl font-black shadow-md", style: { background: CONFIG.primary } }, "NS"),
                            React.createElement("div", null,
                                React.createElement("h1", { class: "text-2xl font-black tracking-tight text-gray-900" }, "NEXT SIEMBRA"),
                                React.createElement("p", { class: "text-xs font-bold text-gray-400 uppercase tracking-widest" }, "Tablero Estratégico PAC"))),
                        React.createElement("div", { class: "flex items-center gap-4 bg-gray-50 px-4 py-2 rounded-xl border border-gray-200" },
                            React.createElement("div", { class: "text-right" },
                                React.createElement("p", { class: "text-xs font-bold text-gray-400 uppercase" }, "Consultor Senior"),
                                React.createElement("p", { class: "text-sm font-bold text-gray-800" }, "Ariel Tarnaruder")),
                            React.createElement("div", { class: "w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center text-gray-600 font-bold text-xs border border-gray-400" }, "AT")))),

                // Menú de Navegación por Solapas Original (Resumen, Programas, Planes, Tareas)
                React.createElement("div", { class: "bg-white border-b border-gray-200 shadow-inner" },
                    React.createElement("div", { class: "max-w-7xl mx-auto px-4 flex space-x-1" },
                        [
                            { id: "resumen", label: "Resumen Ejecutivo", icon: "fa-chart-pie" },
                            { id: "programas", label: "Programas", icon: "fa-layer-group" },
                            { id: "planes", label: "Planes de Acción", icon: "fa-route" },
                            { id: "tareas", label: "Hojas de Ruta (Tareas)", icon: "fa-list-check" }
                        ].map(tab => React.createElement("button", {
                            key: tab.id,
                            onClick: () => setTabActiva(tab.id),
                            class: `flex items-center gap-2 px-5 py-4 border-b-4 font-bold text-sm transition-all ${tabActiva === tab.id ? "text-green-700 border-green-700 bg-green-50/50" : "border-transparent text-gray-500 hover:text-gray-800 hover:bg-gray-50"}`
                        }, React.createElement("i", { class: `fa-solid ${tab.icon}` }), tab.label)))),

                // Contenedor Central de Contenido
                React.createElement("main", { class: "flex-1 max-w-7xl w-full mx-auto px-4 py-8" },
                    
                    // SOLAPA 1: RESUMEN EJECUTIVO
                    tabActiva === "resumen" && React.createElement("div", { class: "space-y-6 animate-fadeIn" },
                        React.createElement("div", { class: "bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-6" },
                            React.createElement("div", { class: "space-y-2 text-center md:text-left" },
                                React.createElement("h3", { class: "text-xl font-bold text-gray-900" }, "Estado de Avance General del PAC"),
                                React.createElement("p", { class: "text-sm text-gray-500" }, "Métrica consolidada en tiempo real desde la matriz de control operativa de Google Sheets.")),
                            React.createElement("div", { class: "flex items-center gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200" },
                                React.createElement("span", { class: "text-3xl font-black text-green-700" }, Math.round(avanceGlobal * 100) + "%"),
                                React.createElement("div", { class: "w-48 bg-gray-200 rounded-full h-4 overflow-hidden" },
                                    React.createElement("div", { class: "bg-green-600 h-full rounded-full transition-all duration-500", style: { width: `${avanceGlobal * 100}%` } })))),
                        
                        React.createElement("div", { class: "grid grid-cols-1 md:grid-cols-3 gap-6" },
                            [
                                { title: "Tareas Pendientes / En curso", count: tareas.filter(t => t.estado !== "Cerrada" && t.estado !== "Bloqueada").length, icon: "fa-clock", color: "text-orange-600", bg: "bg-orange-50" },
                                { title: "Acciones Completadas", count: tareas.filter(t => t.estado === "Cerrada").length, icon: "fa-circle-check", color: "text-green-600", bg: "bg-green-50" },
                                { title: "Alertas / Bloqueadas", count: tareas.filter(t => t.estado === "Bloqueada").length, icon: "fa-circle-exclamation", color: "text-red-600", bg: "bg-red-50" }
                            ].map((card, idx) => React.createElement("div", { key: idx, class: "bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex items-center justify-between" },
                                React.createElement("div", null,
                                    React.createElement("p", { class: "text-xs font-bold text-gray-400 uppercase tracking-wider mb-1" }, card.title),
                                    React.createElement("p", { class: "text-3xl font-black text-gray-900" }, card.count)),
                                React.createElement("div", { class: `w-12 h-12 rounded-xl flex items-center justify-center text-xl ${card.bg} ${card.color}` }, React.createElement("i", { class: `fa-solid ${card.icon}` })))))
                    ),

                    // SOLAPA 2: VISTA DE PROGRAMAS
                    tabActiva === "programas" && React.createElement("div", { class: "space-y-6 animate-fadeIn" },
                        React.createElement("div", { class: "grid grid-cols-1 gap-4" },
                            [...new Set(tareas.map(t => t.programa))].map((prog, idx) => {
                                const ts = tareas.filter(t => t.programa === prog);
                                const av = avg(ts.map(t => t.avance));
                                const sem = obtenerSemaforo(av);
                                return React.createElement("div", { key: idx, class: "bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4" },
                                    React.createElement("div", null,
                                        React.createElement("h4", { class: "text-base font-black text-gray-900" }, prog),
                                        React.createElement("p", { class: "text-xs text-gray-400 mt-1 font-semibold" }, ts.length, " acciones integradas en este bloque")),
                                    React.createElement("div", { class: "flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end" },
                                        React.createElement("div", { class: "w-32 bg-gray-200 h-2 rounded-full overflow-hidden" },
                                            React.createElement("div", { class: "h-full rounded-full", style: { width: `${av*100}%`, backgroundColor: sem.color } })),
                                        React.createElement("span", { class: `text-xs font-bold px-3 py-1 rounded-full border ${sem.bg} ${sem.text} ${sem.border}` }, sem.texto, " (", Math.round(av*100), "%)")));
                            }))
                    ),

                    // SOLAPA 3: VISTA DE PLANES DE ACCIÓN
                    tabActiva === "planes" && React.createElement("div", { class: "space-y-6 animate-fadeIn" },
                        React.createElement("div", { class: "grid grid-cols-1 gap-4" },
                            [...new Set(tareas.map(t => t.plan))].map((plan, idx) => {
                                const ts = tareas.filter(t => t.plan === plan);
                                const av = avg(ts.map(t => t.avance));
                                const sem = obtenerSemaforo(av);
                                return React.createElement("div", { key: idx, class: "bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4" },
                                    React.createElement("div", null,
                                        React.createElement("h4", { class: "text-sm font-black text-gray-800" }, plan),
                                        React.createElement("p", { class: "text-xs text-gray-400 mt-0.5" }, ts[0]?.programa)),
                                    React.createElement("div", { class: "flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end" },
                                        React.createElement("span", { class: `text-xs font-bold px-3 py-1 rounded-full border ${sem.bg} ${sem.text} ${sem.border}` }, sem.texto, " (", Math.round(av*100), "%)")));
                            }))
                    ),

                    // SOLAPA 4: HOJAS DE RUTA (TAREAS OPERATIVAS CON FILTROS ORIGINALES)
                    tabActiva === "tareas" && React.createElement("div", { class: "space-y-6 animate-fadeIn" },
                        // Barra de Filtros Cruzados Originales
                        React.createElement("div", { class: "bg-white p-4 rounded-xl border border-gray-200 shadow-sm grid grid-cols-1 sm:grid-cols-2 gap-4" },
                            React.createElement("div", null,
                                React.createElement("label", { class: "block text-xs font-bold text-gray-400 uppercase mb-1" }, "Filtrar por Programa"),
                                React.createElement("select", {
                                    value: progSel,
                                    onChange: (e) => { setProgSel(e.target.value); setPlanSel("Todos"); },
                                    class: "w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm font-medium focus:outline-none focus:border-green-600"
                                }, programasUnicos.map(p => React.createElement("option", { key: p, value: p }, p)))),
                            React.createElement("div", null,
                                React.createElement("label", { class: "block text-xs font-bold text-gray-400 uppercase mb-1" }, "Filtrar por Plan de Acción"),
                                React.createElement("select", {
                                    value: planSel,
                                    onChange: (e) => setPlanSel(e.target.value),
                                    class: "w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm font-medium focus:outline-none focus:border-green-600"
                                }, planesUnicos.map(pl => React.createElement("option", { key: pl, value: pl }, pl))))),

                        // Tabla de Tareas Operativas Dinámicas
                        React.createElement("div", { class: "bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden" },
                            React.createElement("div", { class: "overflow-x-auto" },
                                React.createElement("table", { class: "w-full text-left border-collapse" },
                                    React.createElement("thead", { class: "bg-gray-50 border-b border-gray-200 text-xs font-bold text-gray-400 uppercase tracking-wider" },
                                        React.createElement("tr", null,
                                            React.createElement("th", { class: "p-4" }, "Tarea / Acción"),
                                            React.createElement("th", { class: "p-4" }, "Responsable"),
                                            React.createElement("th", { class: "p-4" }, "Estado"),
                                            React.createElement("th", { class: "p-4 text-center" }, "Avance"))),
                                    React.createElement("tbody", { class: "divide-y divide-gray-100 text-sm" },
                                        tareasFiltradas.length === 0 ? React.createElement("tr", null, React.createElement("td", { colSpan: 4, class: "p-8 text-center text-gray-400 font-medium" }, "No se encontraron acciones comerciales cargadas con este filtro.")) :
                                        tareasFiltradas.map(t => {
                                            const sem = obtenerSemaforo(t.avance);
                                            return React.createElement("tr", { key: t.id, class: "hover:bg-gray-50/50 transition-all" },
                                                React.createElement("td", { class: "p-4" },
                                                    React.createElement("p", { class: "font-bold text-gray-900" }, t.tarea),
                                                    React.createElement("p", { class: "text-xs text-gray-400 mt-0.5 font-medium" }, t.plan)),
                                                React.createElement("td", { class: "p-4 font-semibold text-gray-600" }, t.responsable),
                                                React.createElement("td", { class: "p-4" },
                                                    React.createElement("span", { class: `text-xs font-bold px-2.5 py-1 rounded-full border ${sem.bg} ${sem.text} ${sem.border}` }, t.estado)),
                                                React.createElement("td", { class: "p-4 text-center font-bold text-gray-800" }, Math.round(t.avance * 100) + "%")
                                            );
                                        })
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
</body>
</html>
