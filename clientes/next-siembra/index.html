  if (v >= 0.10) return { bar:"#F97316", bg:"#FFF7ED", text:"#C2410C", label:"Iniciado" };

function puedeEditar(usuario, tarea) {
  if (!usuario) return false;
  if (usuario.rol==="director"||usuario.rol==="admin"||usuario.rol==="lider") return true;
  if (!tarea?.responsable) return false;
  return tarea.responsable.toLowerCase().includes(usuario.rol.toLowerCase());
}

function esVendedorColectivo(tarea) {
  const r = tarea?.responsable?.toLowerCase()||"";
  return r.includes("vendedor") && (r.includes("x4")||r.includes("x 4"));
}

function avanceVendedores(zonas) {
  const vals = Object.values(zonas).map(z=>z.avance);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}
function initTareas(arr) {
  return arr.map((t,i)=>{
    const base = {...t,id:i,rowIndex:i+2,ultimaActualizacion:null};
    if (esVendedorColectivo(t)) base.zonas = vendedorDefault();
    return base;
  });
}
