//  APP CONTROLLER PRINCIPAL INTER CONEXIÓN AL SPREADSHEET
// ════════════════════════════════════════════════════════════
function App() {
    const [usuario, setUsuario] = useState(undefined);
    const [tareas, setTareas] = useState([]);
    const [loading, setLoading] = useState(true);
    const [vista, setVista] = useState("ejecutivo");
    const [navPlanes, setNavPlanes] = useState({});
    const [modal, setModal] = useState(null);
    const [saving, setSaving] = useState(false);
    const [toast, setToast] = useState(null);
    const [showAyuda, setShowAyuda] = useState(false);
    const [showUserMenu, setShowUserMenu] = useState(false);

    const showToast = (msg, ok = true) => { setToast({ msg, ok }); setTimeout(() => setToast(null), 3000); };
    const handleLogin = (u) => setUsuario(u);
    const handleLogout = () => { setUsuario(undefined); setModal(null); setShowUserMenu(false); };
    const handleNavegar = (destVista, params = {}) => {
        if (destVista === "programas") setVista("programas");
        else if (destVista === "planes") { setNavPlanes({ prog: params.prog, pl: params.pl }); setVista("planes"); }
    };

    const handleEditar = (tarea) => {
        if (puedeEditar(usuario, tarea)) setModal(tarea);
        else showToast("Acceso de lectura. No tenés permisos de edición para este rol.", false);
    };

    const guardar = useCallback(async (form) => {
        setSaving(true);
        try {
            setTareas(prev => prev.map(t => t.id === form.id ? form : t));
            setModal(null);
            showToast("Cambio guardado localmente");
        } finally {
            setSaving(false);
        }
    }, []);

    useEffect(() => {
        if (usuario === undefined) return;
        fetch(SHEET_CSV_URL)
            .then(res => res.text())
            .then(csvText => {
                const lineas = parseCSV(csvText);
                if (lineas.length <= 1) { setTareas([]); setLoading(false); return; }
                
                const encabezados = lineas[0].map(h => h.trim().toLowerCase());
                const rawTareas = [];

                for (let i = 1; i < lineas.length; i++) {
                    const fila = lineas[i];
                    if (fila.length < 3 || !fila[0]) continue;

                    const t = {};
                    encabezados.forEach((h, idx) => { t[h] = fila[idx] ? fila[idx].trim() : ""; });
                    
                    let avNum = parseFloat(t.avance ? t.avance.replace("%", "") : "0");
                    if (avNum > 1) avNum = avNum / 100;

                    const tareaMapeada = {
                        id: i,
                        programa: t.programa || "Sin Programa",
                        plan: t.plan || "Sin Plan",
                        tarea: t.tarea || "Acción sin nombre",
                        responsable: t.responsable || "No asignado",
                        estado: t.estado || "Pendiente",
                        prioridad: t.prioridad || "Media",
                        avance: isNaN(avNum) ? 0 : avNum,
                        comentarios: t.comentarios || t.comentario || "",
                        ultimaActualizacion: t.ultimaactualizacion || null
                    };

                    if (esRZNColectivo(tareaMapeada)) {
                        tareaMapeada.zonas = zonaDefault();
                    }

                    rawTareas.push(tareaMapeada);
                }
                setTareas(rawTareas);
                setLoading(false);
            })
