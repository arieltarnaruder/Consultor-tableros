function puedeEditar(usuario, tarea) {
    if (!usuario) return false; 
    if (usuario.rol === "sr" || usuario.rol === "lider") return true; 
    if (!tarea?.responsable) return false;
    return tarea.responsable.toLowerCase().includes(usuario.rol.toLowerCase()) || 
           tarea.responsable.toLowerCase().includes(usuario.nombre.toLowerCase());
}

function esRZNColectivo(tarea) {
    const r = tarea?.responsable?.toLowerCase() || "";
    return r.includes("vendedor") && (r.includes("x4") || r.includes("x 4") || r.includes("vendedores"));
}

function zonaDefault() {
    return ZONAS.reduce((acc, z) => ({ ...acc, [z]: { avance: 0, estado: "Pendiente", comentario: "" } }), {});
}

function avanceZonas(zonas) {
    const vals = Object.values(zonas).map(z => z.avance);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
}

function colorAvance(v) {
    if (v >= 1.0) return { bar: "#3B82F6", bg: "#EFF6FF", text: "#1D4ED8", label: "Completa", rango: "100%" }; 
    if (v >= 0.80) return { bar: "#22C55E", bg: "#F0FDF4", text: "#15803D", label: "Avanzado", rango: "80-99%" }; 
    if (v >= 0.50) return { bar: "#EAB308", bg: "#FEFCE8", text: "#854D0E", label: "En marcha", rango: "50-79%" }; 
    if (v >= 0.10) return { bar: "#F97316", bg: "#FFF7ED", text: "#C2410C", label: "Iniciado", rango: "10-49%" }; 
    return { bar: "#EF4444", bg: "#FEF2F2", text: "#B91C1C", label: "Sin inicio", rango: "0-9%" };

function parseCSV(text) {
  const lines = []; let row = [""]; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i]; const next = text[i+1];
    if (c === '"') { if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; } else { inQuotes = !inQuotes; } }
    else if (c === ',' && !inQuotes) { row.push(""); }
    else if ((c === '\r' || c === '\n') && !inQuotes) { if (c === '\r' && next === '\n') { i++; } lines.push(row); row = [""]; }
    else { row[row.length - 1] += c; }
  }
  if (row.length > 1 || row[0] !== "") lines.push(row); return lines;
}

function VistaProgramas({ tareas, onEditar }) {
    const [prog, setProg] = useState(null);

    const totalAv = avg(tareas.map(t => t.avance));
    
    const tree = useMemo(() => {

            if (!m[t.programa]) m[t.programa] = {};
            if (!m[t.programa][t.plan]) m[t.programa][t.plan] = [];

        React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(260px,1fr))", gap: 12 } }, Object.keys(tree).map((p, i) => {
            const allT = Object.values(tree[p]).flat();
            const av = avg(allT.map(t => t.avance));

                tarea.ultimaActualizacion && React.createElement("div", { style: { fontSize: 11, color: "#94A3B8", textAlign: "right" } }, "Última actualización: ", new Date(tarea.ultimaActualizacion).toLocaleString("es-AR"))
            ),
            React.createElement("div", { style: { display: "flex", gap: 12, padding: "0 24px 24px" } },
                React.createElement("button", { onClick: onClose, style: { flex: 1, padding: "12px", border: "1.5px solid #E2E8F0", borderRadius: 10, background: "#fff", color: "#0F172A", fontSize: 15, fontWeight: 700, cursor: "pointer" } }, "Cancelar"),
                React.createElement("button", { onClick: () => onSave({ ...f, avance: avanceEfectivo, ultimaActualizacion: new Date().toISOString() }), disabled: saving, style: { flex: 2, padding: "12px", border: "none", borderRadius: 10, background: saving ? "#94A3B8" : CLIENTE.colorA, color: "#fff", fontSize: 15, fontWeight: 800, cursor: saving ? "not-allowed" : "pointer" } }, saving ? "Guardando..." : "Guardar Cambios")
            )
        )
    );
}

// ════════════════════════════════════════════════════════════
//  PANTALLA DE LOGIN
// ════════════════════════════════════════════════════════════
function PantallaLogin({ onLogin, usuarios }) {
    const [pin, setPin] = useState("");
    const [err, setErr] = useState("");
    
    const tryLogin = (p) => { 
        const u = usuarios.find(usr => usr.pin === p); 
        if (u) onLogin(u);
        else { setErr("PIN incorrecto"); setPin(""); } 
    };
    
    const handleKey = (d) => { 
        if (pin.length >= 4) return; 
        const n = pin + d; 
        setPin(n); 
        setErr(""); 
        if (n.length === 4) setTimeout(() => tryLogin(n), 120); 
    };
    
    const btnS = { padding: "16px 0", borderRadius: 10, border: "1.5px solid #E2E8F0", background: "#F8FAFC", fontSize: 18, fontWeight: 700, color: "#0F172A", cursor: "pointer" };
    
    return React.createElement("div", { style: { minHeight: "100vh", background: "#F1F5F9", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20 } },
        React.createElement("div", { style: { marginBottom: 32, textAlign: "center" } },
            React.createElement(LogoNextSiembra, { height: 50 }),
            React.createElement("div", { style: { fontSize: 15, color: "#0F172A", fontWeight: 800, marginTop: 12, letterSpacing: "-0.01em" } }, CLIENTE.subtitulo)
        ),
        React.createElement("div", { style: { background: "#fff", borderRadius: 20, padding: "30px", width: "100%", maxWidth: 340, boxShadow: "0 10px 40px rgba(0,0,0,.08)", border: "1px solid #E2E8F0" } },
            React.createElement("div", { style: { height: 5, background: `linear-gradient(90deg, ${CLIENTE.colorA}, ${CLIENTE.colorB})`, borderRadius: 99, marginBottom: 24 } }),
            React.createElement("div", { style: { textAlign: "center", marginBottom: 20 } },
                React.createElement("div", { style: { fontSize: 16, fontWeight: 800, color: "#0F172A" } }, "Ingresá tu PIN")
            ),
            React.createElement("div", { style: { display: "flex", justifyContent: "center", gap: 14, marginBottom: 20 } },
                [0, 1, 2, 3].map(i => React.createElement("div", { key: i, style: { width: 18, height: 18, borderRadius: "50%", background: i < pin.length ? CLIENTE.colorA : "#E2E8F0", border: `2px solid ${i < pin.length ? CLIENTE.colorA : "#CBD5E1"}` } }))
            ),
            err && React.createElement("div", { style: { background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 10, padding: "10px", fontSize: 13, color: "#B91C1C", textAlign: "center", marginBottom: 16, fontWeight: 700 } }, err),
            React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 } },
                [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => React.createElement("button", { key: d, onClick: () => handleKey(String(d)), style: btnS }, d)),
                React.createElement("button", { onClick: () => setPin(""), style: { ...btnS, fontSize: 12, color: "#64748B" } }, "Borrar"),
                React.createElement("button", { onClick: () => handleKey("0"), style: btnS }, "0"),
                React.createElement("button", { onClick: () => { setPin(p => p.slice(0, -1)); setErr(""); }, style: { ...btnS, fontSize: 18, color: "#64748B" } }, "✕")
            ),
            React.createElement("div", { style: { borderTop: "1px solid #F1F5F9", marginTop: 16, paddingTop: 16, textAlign: "center" } },
                React.createElement("button", { onClick: () => onLogin(null), style: { background: "none", border: "none", color: "#64748B", fontSize: 13, cursor: "pointer", fontWeight: 700, textDecoration: "underline" } }, "Ingresar como Lectura")
            )
        )
    );
}

// ════════════════════════════════════════════════════════════
//  APP CONTROLLER PRINCIPAL
// ════════════════════════════════════════════════════════════
function App() {
    const [usuario, setUsuario] = useState(undefined);
    const [tareas, setTareas] = useState([]);
    const [loading, setLoading] = useState(true);
    const [vista, setVista] = useState("ejecutivo");
    const [modal, setModal] = useState(null);
    const [saving, setSaving] = useState(false);
    const [toast, setToast] = useState(null);
    const [showAyuda, setShowAyuda] = useState(false);
    const [showUserMenu, setShowUserMenu] = useState(false);
    const [imprimiendo, setImprimiendo] = useState(false);

    const showToast = (msg, ok = true) => { setToast({ msg, ok }); setTimeout(() => setToast(null), 3000); };
    const handleLogin = (u) => setUsuario(u);
    const handleLogout = () => { setUsuario(undefined); setModal(null); setShowUserMenu(false); };

    const handleEditar = (tarea) => {
        if (puedeEditar(usuario, tarea)) setModal(tarea);
        else showToast("Acceso de lectura. No tenés permisos de edición para este rol.", false);
    };

    const guardar = useCallback(async (form) => {
        setSaving(true);
        try {
            setTareas(prev => prev.map(t => t.id === form.id ? form : t));
            setModal(null);
            showToast("Cambio guardado localmente");
        } finally {
            setSaving(false);
        }
    }, []);

    const handlePrint = () => {
        setImprimiendo(true);
        setTimeout(() => {
            window.print();
            setImprimiendo(false);
        }, 500);
    };

    useEffect(() => {
        if (usuario === undefined) return;
        fetch(SHEET_CSV_URL)
            .then(res => res.text())
            .then(csvText => {
                const lineas = parseCSV(csvText);
                if (lineas.length <= 1) { setTareas([]); setLoading(false); return; }
                
                const encabezados = lineas[0].map(h => h.trim().toLowerCase());
                const rawTareas = [];

                for (let i = 1; i < lineas.length; i++) {
                    const fila = lineas[i];
                    if (fila.length < 3 || !fila[0]) continue;

                    const t = {};
                    encabezados.forEach((h, idx) => { t[h] = fila[idx] ? fila[idx].trim() : ""; });
                    
                    let avNum = parseFloat(t.avance ? t.avance.replace("%", "") : "0");
                    if (avNum > 1) avNum = avNum / 100;

                    const tareaMapeada = {
                        id: i,
                        programa: t.programa || "Sin Programa",
                        plan: t.plan || "Sin Plan",
                        tarea: t.tarea || "Acción sin nombre",
                        responsable: t.responsable || "No asignado",
                        estado: t.estado || "Pendiente",
                        prioridad: t.prioridad || "Media",
                        avance: isNaN(avNum) ? 0 : avNum,
                        comentarios: t.comentarios || t.comentario || "",
                        ultimaActualizacion: t.ultimaactualizacion || null
                    };

                    if (esRZNColectivo(tareaMapeada)) {
                        tareaMapeada.zonas = zonaDefault();
                    }

                    rawTareas.push(tareaMapeada);
                }
                setTareas(rawTareas);
                setLoading(false);
            })
            .catch(err => { console.error(err); setLoading(false); });
    }, [usuario]);

    if (usuario === undefined) return React.createElement(PantallaLogin, { onLogin: handleLogin, usuarios: USUARIOS_INIT });
    if (loading) return React.createElement("div", { id: "loading" }, React.createElement("div", { className: "spinner" }), React.createElement("span", null, "Sincronizando Matriz de Demanda..."));

    const fechaHoy = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const fechaFormateada = fechaHoy.charAt(0).toUpperCase() + fechaHoy.slice(1);
    const rolColor = usuario?.rol === "sr" ? CLIENTE.colorA : "#475569";

    return React.createElement("div", { style: { minHeight: "100vh", background: "#F1F5F9" } },
        toast && React.createElement(Toast, { msg: toast.msg, ok: toast.ok }),
        modal && React.createElement(Modal, { tarea: modal, onSave: guardar, onClose: () => setModal(null), saving: saving, usuario: usuario }),
        showAyuda && React.createElement(ModalAyuda, { onClose: () => setShowAyuda(false) }),
        
        imprimiendo && React.createElement(VistaReportePDF, { tareas: tareas }),

        React.createElement("div", { className: "no-print", style: { background: "#fff", borderBottom: "1px solid #E2E8F0", position: "sticky", top: 0, zIndex: 100, boxShadow: "0 1px 8px rgba(0,0,0,.06)" } },
            React.createElement("div", { style: { maxWidth: 1040, margin: "0 auto", padding: "0 20px" } },
                React.createElement("div", { style: { height: 5, background: `linear-gradient(90deg, ${CLIENTE.colorA}, ${CLIENTE.colorB})`, margin: "0 -20px" } }),
                React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 0 0", flexWrap: "wrap", gap: 14 } },
                    React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 16 } },
                        React.createElement(LogoNextSiembra, { height: 46 }),
                        React.createElement("div", { style: { borderLeft: "2px solid #E2E8F0", paddingLeft: 16 } },
                            React.createElement("div", { style: { fontSize: 18, color: "#0F172A", fontWeight: 900, letterSpacing: "-0.02em" } }, CLIENTE.subtitulo),
                            React.createElement("div", { style: { fontSize: 11, color: "#64748B", fontWeight: 700, textTransform: "uppercase", letterSpacing: ".05em", marginTop: 2 } }, "Tablero de Control • " + fechaFormateada)
                        )
                    ),
                    React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 14 } },
                        React.createElement("button", { onClick: () => setShowAyuda(true), style: { background: "none", border: "none", fontSize: 12, fontWeight: 700, color: "#94A3B8", cursor: "pointer", textDecoration: "underline" } }, "Ayuda / Instructivo"),
                        React.createElement("div", { style: { position: "relative" } },
                            React.createElement("button", { onClick: () => setShowUserMenu(v => !v), style: { display: "flex", alignItems: "center", gap: 8, background: "#F8FAFC", border: `1.5px solid ${rolColor}`, borderRadius: 99, padding: "6px 14px", cursor: "pointer" } },
                                React.createElement("span", { style: { width: 10, height: 10, borderRadius: "50%", background: rolColor } }),
                                React.createElement("span", { style: { fontSize: 13, fontWeight: 800, color: "#0F172A" } }, usuario?.nombre || "Solo lectura"),
                                React.createElement("span", { style: { fontSize: 10, color: "#94A3B8" } }, "▼")
                            ),
                            showUserMenu && React.createElement("div", { style: { position: "absolute", right: 0, top: "calc(100% + 8px)", background: "#fff", border: "1px solid #E2E8F0", borderRadius: 12, boxShadow: "0 10px 30px rgba(0,0,0,.15)", minWidth: 160, zIndex: 200, overflow: "hidden" } },
                                React.createElement("button", { onClick: handleLogout, style: { width: "100%", padding: "12px 16px", border: "none", background: "none", textAlign: "left", fontSize: 14, color: "#EF4444", cursor: "pointer", fontWeight: 700 } }, "Cerrar sesión")
                            )
                        )
                    )
                ),
                React.createElement("div", { style: { display: "flex", gap: 0, marginTop: 14, width: "100%", alignItems: "center" } },
                    [
                        { id: "ejecutivo", label: "Resumen" },
                        { id: "programas", label: "Programas" },
                        { id: "planes", label: "Planes" },
                        { id: "tareas", label: "Tareas" }
                    ].map(tab => React.createElement("button", { key: tab.id, onClick: () => setVista(tab.id), style: { padding: "12px 20px", border: "none", background: "none", cursor: "pointer", fontSize: 14, fontWeight: 800, color: vista === tab.id ? CLIENTE.colorA : "#64748B", borderBottom: `3px solid ${vista === tab.id ? CLIENTE.colorA : "transparent"}`, marginBottom: -1 } }, tab.label)),
                    
                    React.createElement("button", { onClick: handlePrint, style: { marginLeft: 16, display: "flex", alignItems: "center", gap: 6, background: "#F1F5F9", border: "1px solid #CBD5E1", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 12, fontWeight: 800, color: "#0F172A" } }, "📄 Reporte PDF"),
                    
                    React.createElement("button", { onClick: () => setVista("equipos"), style: { marginLeft: "auto", padding: "12px 20px", border: "none", background: "none", cursor: "pointer", fontSize: 14, fontWeight: 900, color: vista === "equipos" ? CLIENTE.colorA : CLIENTE.colorB, borderBottom: `3px solid ${vista === "equipos" ? CLIENTE.colorA : "transparent"}`, marginBottom: -1 } }, "EQUIPO")
                )
            )
        ),
        React.createElement("div", { className: "no-print", style: { maxWidth: 1040, margin: "0 auto", padding: "24px 20px 80px" } },
            vista === "ejecutivo" && React.createElement(VistaEjecutiva, { tareas: tareas, onEditar: handleEditar }),
            vista === "programas" && React.createElement(VistaProgramas, { tareas: tareas, onEditar: handleEditar }),
            vista === "planes" && React.createElement(VistaPlanesAll, { tareas: tareas, onEditar: handleEditar }),
            vista === "equipos" && React.createElement(VistaEquipos, { tareas: tareas, onEditar: handleEditar }),
            vista === "tareas" && React.createElement(VistaTareas, { tareas: tareas, onEditar: handleEditar })
        )
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
